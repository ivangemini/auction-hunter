name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node scripts/validate-yandex-draft.mjs
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run qa:browser
      - run: node scripts/render-yandex-promos.mjs
      - run: node scripts/capture-yandex-screenshots.mjs
      - run: node scripts/capture-restoration-review.mjs
      - name: Upload restoration visual review
        uses: actions/upload-artifact@v4
        with:
          name: auction-hunter-restoration-review-ci
          path: release/screenshots/review/**/*.png
          if-no-files-found: error
          retention-days: 7
      - run: node scripts/capture-item-art-review.mjs
      - name: Upload P7 item-art visual review
        uses: actions/upload-artifact@v4
        with:
          name: auction-hunter-item-art-review-ci
          path: release/screenshots/item-review/generated/*.png
          if-no-files-found: error
          retention-days: 7
      - run: node scripts/capture-environment-art-review.mjs
      - name: Upload P7 environment visual review
        uses: actions/upload-artifact@v4
        with:
          name: auction-hunter-environment-review-ci
          path: release/screenshots/environment-review/generated/*.png
          if-no-files-found: error
          retention-days: 7
      - run: node scripts/capture-collection-market-review.mjs
      - name: Upload P7 Collection and Buyer Market review
        uses: actions/upload-artifact@v4
        with:
          name: auction-hunter-collection-market-review-ci
          path: release/screenshots/collection-market-review/**/*.png
          if-no-files-found: error
          retention-days: 7
      - run: node scripts/capture-character-tutorial-review.mjs
      - name: Upload P7 character and tutorial review
        uses: actions/upload-artifact@v4
        with:
          name: auction-hunter-character-tutorial-review-ci
          path: release/screenshots/character-tutorial-review/**/*.png
          if-no-files-found: error
          retention-days: 7
      - run: node scripts/capture-office-review.mjs
      - name: Upload P7 Office visual review
        uses: actions/upload-artifact@v4
        with:
          name: auction-hunter-office-review-ci
          path: release/screenshots/office-review/**/*.png
          if-no-files-found: error
          retention-days: 7
      - name: Upload screenshot diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: auction-hunter-screenshot-debug
          path: release/screenshots/debug/*.png
          if-no-files-found: ignore
          retention-days: 3
      - run: node scripts/validate-yandex-archive.mjs
      - name: Build Yandex candidate ZIP
        shell: bash
        run: |
          cd dist
          zip -r ../auction-hunter-yandex.zip .
      - run: node scripts/build-yandex-submission.mjs
        env:
          SOURCE_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build unified Yandex submission ZIP
        shell: bash
        run: |
          cd release/submission/generated
          zip -r ../../../auction-hunter-yandex-submission.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: auction-hunter-yandex-ci
          path: auction-hunter-yandex.zip
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: auction-hunter-yandex-promos-ci
          path: release/promotional/generated/*.png
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: auction-hunter-yandex-screenshots-ci
          path: release/screenshots/generated/**/*.png
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: auction-hunter-yandex-submission-ci
          path: auction-hunter-yandex-submission.zip
          if-no-files-found: error
          retention-days: 7

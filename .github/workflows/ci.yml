name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Commit lockfile bootstrap
        if: github.event_name == 'pull_request' && github.head_ref == 'work/reproducible-deps'
        shell: bash
        run: |
          cp package-lock.json /tmp/package-lock.json
          git fetch origin "$GITHUB_HEAD_REF"
          git checkout -B "$GITHUB_HEAD_REF" "origin/$GITHUB_HEAD_REF"
          cp /tmp/package-lock.json package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already committed"
            exit 0
          fi
          git commit -m "Add reproducible npm lockfile"
          git push origin "HEAD:$GITHUB_HEAD_REF"
      - run: node scripts/validate-yandex-draft.mjs
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run qa:browser
      - run: node scripts/render-yandex-promos.mjs
      - run: node scripts/capture-yandex-screenshots.mjs
      - run: node scripts/validate-yandex-archive.mjs
      - name: Build Yandex candidate ZIP
        shell: bash
        run: |
          cd dist
          zip -r ../auction-hunter-yandex.zip .
      - run: node scripts/build-yandex-submission.mjs
        env:
          SOURCE_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build unified Yandex submission ZIP
        shell: bash
        run: |
          cd release/submission/generated
          zip -r ../../../auction-hunter-yandex-submission.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: auction-hunter-yandex-ci
          path: auction-hunter-yandex.zip
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: auction-hunter-yandex-promos-ci
          path: release/promotional/generated/*.png
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: auction-hunter-yandex-screenshots-ci
          path: release/screenshots/generated/**/*.png
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: auction-hunter-yandex-submission-ci
          path: auction-hunter-yandex-submission.zip
          if-no-files-found: error
          retention-days: 7

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: node scripts/validate-yandex-draft.mjs
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run qa:browser
      - run: node scripts/render-yandex-promos.mjs
      - run: node scripts/capture-yandex-screenshots.mjs
      - run: node scripts/validate-yandex-archive.mjs
      - name: Build Yandex candidate ZIP
        shell: bash
        run: |
          cd dist
          zip -r ../auction-hunter-yandex.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: auction-hunter-yandex-ci
          path: auction-hunter-yandex.zip
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: auction-hunter-yandex-promos-ci
          path: release/promotional/generated/*.png
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: auction-hunter-yandex-screenshots-ci
          path: release/screenshots/generated/**/*.png
          if-no-files-found: error
          retention-days: 7

name: Yandex Release Archive

on:
  workflow_dispatch:
  push:
    branches:
      - release/yandex-candidate

permissions:
  contents: read

concurrency:
  group: yandex-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archive:
    runs-on: ubuntu-latest
    env:
      VITE_YANDEX_METRICA_ID: ${{ vars.YANDEX_METRICA_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: node scripts/validate-yandex-draft.mjs
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run qa:browser
      - run: node scripts/render-yandex-promos.mjs
      - run: node scripts/validate-yandex-archive.mjs
      - name: Build ZIP with index.html at root
        shell: bash
        run: |
          cd dist
          zip -r ../auction-hunter-yandex.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: auction-hunter-yandex
          path: auction-hunter-yandex.zip
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: auction-hunter-yandex-promos
          path: release/promotional/generated/*.png
          if-no-files-found: error
          retention-days: 14

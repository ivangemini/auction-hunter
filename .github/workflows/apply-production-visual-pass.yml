name: Apply production visual integration

on:
  push:
    branches: [production-visual-integration-2026-08-26]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-visual-integration-2026-08-26
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Normalize one-shot patch literals
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('scripts/apply-production-visual-pass.mjs')
          s = p.read_text()

          # Two range replacements intentionally retain their end marker. Keep the
          # generated closing line in the source, not duplicated in replacement text.
          s = s.replace(
              "  container.add([outerShadow, glow, outer, frame, image, topLight, foot]);\n  return container;\n}`,\n    'character portrait frame',",
              "  container.add([outerShadow, glow, outer, frame, image, topLight, foot]);\n  return container;`,\n    'character portrait frame',",
          )
          s = s.replace(
              "    }\n    card.add(hero);`,\n    'BuyerMarket item hero',",
              "    }`,\n    'BuyerMarket item hero',",
          )

          # The patch file embeds TypeScript template literals. Convert String.raw
          # blocks to ordinary JS templates while escaping inner backticks and ${}
          # so Node emits the TypeScript text verbatim.
          marker = 'String.raw`'
          cursor = 0
          while True:
              start = s.find(marker, cursor)
              if start < 0:
                  break
              body_start = start + len(marker)
              match = re.search(r"`\s*,\n\s*'", s[body_start:])
              if not match:
                  raise SystemExit(f'No closing template marker after {start}')
              end = body_start + match.start()
              body = s[body_start:end]
              escaped = body.replace('`', r'\`').replace('${', r'\${')
              s = s[:start] + '`' + escaped + '`' + s[end + 1:]
              cursor = start + len(escaped) + 2

          p.write_text(s)
          PY
      - run: node --check scripts/apply-production-visual-pass.mjs
      - run: node scripts/apply-production-visual-pass.mjs
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Remove one-shot patch machinery
        shell: bash
        run: |
          rm scripts/apply-production-visual-pass.mjs
          rm .github/workflows/apply-production-visual-pass.yml
      - name: Commit integrated presentation pass
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Visual: integrate production presentation across runtime [skip ci]"
          git push origin HEAD:production-visual-integration-2026-08-26

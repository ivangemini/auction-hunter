name: Capture bright commercial runtime

on:
  push:
    branches:
      - production-visual-integration-2026-08-26

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-visual-integration-2026-08-26
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/capture-yandex-screenshots.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: auction-hunter-commercial-runtime
          path: release/screenshots/generated
          if-no-files-found: error

      - name: Remove one-shot workflow
        run: |
          rm -f .github/workflows/capture-commercial-runtime.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove commercial runtime capture workflow [skip ci]"
          git push origin HEAD:production-visual-integration-2026-08-26

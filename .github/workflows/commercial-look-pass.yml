name: Bright commercial runtime look pass

on:
  push:
    branches:
      - production-visual-integration-2026-08-26

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-visual-integration-2026-08-26
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply commercial look
        run: python scripts/apply-commercial-look.py

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit result
        run: |
          rm -f .github/workflows/commercial-look-pass.yml
          rm -f scripts/apply-commercial-look.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Visual: match bright commercial concept across core runtime"
          git push origin HEAD:production-visual-integration-2026-08-26
